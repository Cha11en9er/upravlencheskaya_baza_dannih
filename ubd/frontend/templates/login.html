<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — УБД</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="logo-big">УБД</div>
    <h1>Управленческая база данных</h1>
    {% if error %}<div class="flash flash-err">{{ error }}</div>{% endif %}
    <label class="f-field">
      <span class="f-label">Логин</span>
      <input type="text" name="email" required autofocus autocomplete="username">
    </label>
    <label class="f-field">
      <span class="f-label">Пароль</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Войти</button>
    <p class="hint">Логины и пароли назначает Администратор</p>
  </form>
</body>
</html>
